[package]
name = "qwasar-server"
version = "0.1.0"
edition = "2024"

[lib]
path = "server/lib.rs"

[[bin]]
name = "qwasar-server"
path = "server/main.rs"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1.0.151"
rusqlite = { version = "0.29.0", features = ["bundled"] }
futures-util = "0.3.33"
sha2 = "0.11.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.4"
